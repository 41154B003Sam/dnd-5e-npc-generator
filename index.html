<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D 5E 劇情導向非典型 NPC 智慧生成系統</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --gold: #f59e0b;
      --cyan: #38bdf8;
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(129, 140, 248, 0.4);
      color: #818cf8;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      background: #080c14;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-btn:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .btn-generate:active {
      transform: translateY(0);
    }

    /* Output Card */
    .card-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-action {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: #334155;
      border-color: #475569;
    }

    .preview-card {
      background: #080c14;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      font-size: 14px;
      line-height: 1.7;
    }

    .preview-card h2 {
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 4px;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 8px;
    }

    .preview-card .meta-strip {
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .section-h3 {
      font-size: 16px;
      color: var(--cyan);
      margin: 18px 0 8px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    .stats-table, .equip-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }

    .stats-table th, .stats-table td,
    .equip-table th, .equip-table td {
      border: 1px solid #1e293b;
      padding: 8px 10px;
      text-align: left;
    }

    .stats-table th, .equip-table th {
      background: #0f172a;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #38bdf8;
    }

    .stat-mod {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--green);
    }

    .trait-alert {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--gold);
      padding: 10px 14px;
      border-radius: 4px;
      margin: 10px 0;
    }

    .hook-alert {
      background: rgba(99, 102, 241, 0.1);
      border-left: 4px solid var(--accent);
      padding: 10px 14px;
      border-radius: 4px;
      margin: 10px 0;
    }

    /* Print optimization */
    @media print {
      body { background: white; color: black; padding: 0; }
      .main-grid { display: block; }
      .panel:first-child, header, .card-actions { display: none; }
      .panel { border: none; box-shadow: none; padding: 0; background: transparent; }
      .preview-card { border: 1px solid #ccc; background: white; color: black; }
      .preview-card h2 { color: black; border-color: black; }
      .section-h3 { color: black; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">D&D 5E 劇情向專用生成器</div>
      <h1>D&D 5E 劇情導向非典型 NPC 智慧生成系統</h1>
      <p class="subtitle">告別死板冒險者模板 • 解耦生活外貌與戰鬥底層 • 生活道具自動映射武器法器</p>
    </header>

    <div class="main-grid">
      <!-- 左側：輸入表單 -->
      <div class="panel">
        <div class="panel-title">⚙️ 角色靈感與條件設定</div>

        <div class="form-group">
          <label>快速填入經典範例：</label>
          <div class="quick-tags">
            <button class="tag-btn" onclick="applyPreset('farmer')">🌾 麥農草耙退隱戰士</button>
            <button class="tag-btn" onclick="applyPreset('wizard')">💨 抽煙斗的14環大魔導師</button>
            <button class="tag-btn" onclick="applyPreset('undertaker')">⛏️ 鐵鎬茶杯守墓人</button>
            <button class="tag-btn" onclick="applyPreset('chef')">🍖 剁骨刀火爆大廚</button>
          </div>
        </div>

        <div class="form-group">
          <label>角色姓名 (留空則隨機生成)：</label>
          <input type="text" id="npcName" placeholder="例如：老丹恩、摩斯、高登">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label>種族：</label>
            <select id="npcRace">
              <option value="RANDOM">🎲 隨機決定</option>
              <option value="人類 (Human)">人類 (Human)</option>
              <option value="山地矮人 (Mountain Dwarf)">山地矮人 (Mountain Dwarf)</option>
              <option value="丘陵矮人 (Hill Dwarf)">丘陵矮人 (Hill Dwarf)</option>
              <option value="高等精靈 (High Elf)">高等精靈 (High Elf)</option>
              <option value="輕足半身人 (Lightfoot Halfling)">輕足半身人 (Lightfoot Halfling)</option>
              <option value="提夫林 (Tiefling)">提夫林 (Tiefling)</option>
              <option value="半獸人 (Half-Orc)">半獸人 (Half-Orc)</option>
              <option value="岩石侏儒 (Rock Gnome)">岩石侏儒 (Rock Gnome)</option>
              <option value="龍裔 (Dragonborn)">龍裔 (Dragonborn)</option>
              <option value="半精靈 (Half-Elf)">半精靈 (Half-Elf)</option>
            </select>
          </div>

          <div class="form-group">
            <label>職業：</label>
            <select id="npcClass">
              <option value="RANDOM">🎲 隨機決定</option>
              <option value="戰士 (Fighter)">戰士 (Fighter)</option>
              <option value="法師 (Wizard)">法師 (Wizard)</option>
              <option value="遊盪者 (Rogue)">遊盪者 (Rogue)</option>
              <option value="野蠻人 (Barbarian)">野蠻人 (Barbarian)</option>
              <option value="牧師 (Cleric)">牧師 (Cleric)</option>
              <option value="聖騎士 (Paladin)">聖騎士 (Paladin)</option>
              <option value="遊俠 (Ranger)">遊俠 (Ranger)</option>
              <option value="吟遊詩人 (Bard)">吟遊詩人 (Bard)</option>
              <option value="德魯伊 (Druid)">德魯伊 (Druid)</option>
              <option value="武僧 (Monk)">武僧 (Monk)</option>
              <option value="契術師 (Warlock)">契術師 (Warlock)</option>
              <option value="術士 (Sorcerer)">術士 (Sorcerer)</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label>背景歷練：</label>
            <select id="npcBackground">
              <option value="RANDOM">🎲 隨機決定</option>
              <option value="民間英雄 (Folk Hero)">民間英雄 (Folk Hero)</option>
              <option value="士兵 (Soldier)">士兵 (Soldier)</option>
              <option value="侍祭 (Acolyte)">侍祭 (Acolyte)</option>
              <option value="行會工匠 (Guild Artisan)">行會工匠 (Guild Artisan)</option>
              <option value="貴族 (Noble)">貴族 (Noble)</option>
              <option value="流浪兒 (Urchin)">流浪兒 (Urchin)</option>
              <option value="學者 (Sage)">學者 (Sage)</option>
              <option value="水手 (Sailor)">水手 (Sailor)</option>
              <option value="罪犯 (Criminal)">罪犯 (Criminal)</option>
              <option value="隱士 (Hermit)">隱士 (Hermit)</option>
            </select>
          </div>

          <div class="form-group">
            <label>等級 / 關鍵字：</label>
            <input type="text" id="npcLevel" value="1" placeholder="例如：1、14、大魔導師、老兵、封印">
          </div>
        </div>

        <div class="form-group">
          <label>獨特超常特質 (預設無，為常規凡人)：</label>
          <input type="text" id="npcTrait" placeholder="留空或輸入：無、火焰、霜凍、靈魂、自訂">
        </div>

        <div class="form-group">
          <label>劇情線索與非典型生活裝備補充：</label>
          <textarea id="npcStory" placeholder="輸入當前劇情或生活描述。例如：『表面是麥農，但真實身分是退隱禁衛長戰士，武器是一柄鋼齒長草耙』"></textarea>
        </div>

        <!-- Gemini AI 智慧敘事設定 (金鑰由後端安全隔離環境載入，前端完全不顯示亦無洩漏風險) -->
        <div class="form-group" style="background: rgba(15, 23, 42, 0.7); padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 12px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <label style="color: #38bdf8; font-weight: bold; margin: 0; display: flex; align-items: center; gap: 6px;">
              <span>🤖 Gemini AI 智慧敘事核心</span>
            </label>
            <span id="aiStatusBadge" style="font-size: 11px; background: #065f46; color: #a7f3d0; padding: 2px 8px; border-radius: 4px;">🟢 雲端引擎連線</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" id="enableAiCheckbox" checked style="width: auto; margin: 0; cursor: pointer;">
            <label for="enableAiCheckbox" style="margin: 0; font-size: 12px; color: #cbd5e1; cursor: pointer;">啟用 AI 深度撰寫身世、小動作與 5E 生活武器規格</label>
          </div>
        </div>

        <button class="btn-generate" onclick="generateNPC()">
          <span>🎲 立即智慧生成 NPC 角色卡</span>
        </button>
      </div>

      <!-- 右側：即時角色卡預覽 -->
      <div class="panel">
        <div class="card-actions">
          <button class="btn-action" style="background: #2563eb; border-color: #1d4ed8; font-weight: bold; color: white;" onclick="copyCardMarkdown()">📋 複製文字卡</button>
          <button class="btn-action" onclick="exportCSV()">📑 匯出 CSV 試算表</button>
          <button class="btn-action" onclick="exportJSON()">💾 匯出 JSON 資料</button>
          <button class="btn-action" onclick="window.print()">🖨️ 列印 / 存 PDF</button>
        </div>

        <div class="preview-card" id="cardContent">
          <!-- 角色卡內容將由 JS 即時渲染於此 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 規則庫資料字典 (D&D 5E Traditional Chinese)
    // ==========================================
    const RACES = {

      "岩石侏儒 (Rock Gnome)": { saves: "侏儒狡黠", langs: ["通用語", "侏儒語"], bonus: "智力 +2、體質 +1", darkvision: "60 呎" },

      "吟遊詩人 (Bard)": { hd: "1d8", hpBase: 8, hpPer: 5, saves: ["敏捷 (DEX)", "魅力 (CHA)"], primary: ["CHA", "DEX", "CON", "WIS", "INT", "STR"], defaultWeapon: "細劍 (1d8 穿刺)", defaultArmor: "皮甲 (11 + 敏捷)" },
      "德魯伊 (Druid)": { hd: "1d8", hpBase: 8, hpPer: 5, saves: ["智力 (INT)", "感知 (WIS)"], primary: ["WIS", "CON", "DEX", "STR", "CHA", "INT"], defaultWeapon: "彎刀 (1d6 揮砍)", defaultArmor: "皮革甲 (11 + 敏捷)" },

    let currentNPCData = null;

    // 4d6 drop lowest
    function roll4d6dl1() {
      let dice = [Math.floor(Math.random()*6)+1, Math.floor(Math.random()*6)+1, Math.floor(Math.random()*6)+1, Math.floor(Math.random()*6)+1];
      dice.sort((a,b) => b-a);
      return { total: dice[0]+dice[1]+dice[2], dice: dice, dropped: dice[3] };
    }

    function calcMod(score) {
      let mod = Math.floor((score - 10) / 2);
      return mod >= 0 ? `+${mod}` : `${mod}`;
    }

    function parseLevel(input) {
      let text = (input || "").trim().toLowerCase();
      let lv = 1;
      let note = "";
      if (text.includes("大魔導師") || text.includes("大魔導") || text.includes("archmage")) {
        lv = 14; note = "大魔導師階級 (Lv.14)";
      } else if (text.includes("老兵") || text.includes("veteran")) {
        lv = 5; note = "精銳老兵 (Lv.5)";
      } else if (text.includes("學徒") || text.includes("apprentice")) {
        lv = 2; note = "見習學徒 (Lv.2)";
      } else {
        let match = text.match(/\d+/);
        if (match) lv = Math.min(20, Math.max(1, parseInt(match[0])));
      }
      if (text.includes("封印") || text.includes("詛咒") || text.includes("受限")) {
        note += " [⚠️ 部分法術環位已遭封印/限制]";
      }
      return { level: lv, note: note };
    }

          <p style="font-size: 12px; color: #34d399; margin-top: 10px;">💡 系統遵循「非主動不請求」原則，目前尚未消耗任何 API 額度。</p>

    let currentRawCardMarkdown = "";

    async function generateNPC() {
      const btn = document.querySelector('.btn-generate');
      const originalBtnText = btn.innerHTML;
      const enableAI = document.getElementById('enableAiCheckbox') ? document.getElementById('enableAiCheckbox').checked : true;

      let raceKey = document.getElementById('npcRace').value;
      let classKey = document.getElementById('npcClass').value;
      let bgKey = document.getElementById('npcBackground').value;
      let name = document.getElementById('npcName').value.trim();
      let levelVal = document.getElementById('npcLevel').value.trim() || '1';
      let traitInput = document.getElementById('npcTrait').value.trim();
      let story = document.getElementById('npcStory').value.trim();

      // 如果啟用 AI，優先呼叫本地 /api/generate
      if (enableAI) {
        btn.innerHTML = '<span>⏳ 🤖 Gemini AI 創作中，請稍候...</span>';
        btn.disabled = true;
        document.getElementById('cardContent').innerHTML = `
          <div style="padding: 40px 20px; text-align: center; color: #94a3b8;">
            <div style="font-size: 38px; margin-bottom: 12px; animation: pulse 1.5s infinite;">🤖</div>
            <h3 style="color: #38bdf8; margin-bottom: 8px;">Gemini AI 正在創作深度角色身世與裝備中...</h3>
            <p style="font-size: 13px; line-height: 1.6; color: #cbd5e1;">正在為角色規格化 D&D 5E 非典型生活武器/法器、撰寫反差個性細節小動作與 DM 伏筆線索...</p>
            <p style="font-size: 12px; color: #64748b; margin-top: 8px;">⏳ 通常約需 3~8 秒，請稍候...</p>
          </div>
        `;

        try {
          const resp = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: name || undefined,
              race: raceKey === 'RANDOM' ? undefined : raceKey,
              class_name: classKey === 'RANDOM' ? undefined : classKey,
              background: bgKey === 'RANDOM' ? undefined : bgKey,
              level: levelVal,
              story_context: story || undefined,
              custom_trait: traitInput || undefined,
              force_ai: true
            })
          });

          if (resp.ok) {
            const data = await resp.json();
            if (data.status === 'success' && data.npc) {
              currentNPCData = data.npc;
              currentRawCardMarkdown = data.card;
              renderAICard(data.npc);
              const badge = document.getElementById('aiStatusBadge');
              if (badge) {
                badge.innerText = '🟢 AI 生成完成';
                badge.style.background = '#065f46';
              }
              btn.innerHTML = originalBtnText;
              btn.disabled = false;
              return;
            }
          }
        } catch (e) {
          console.warn("後端 API 連線失敗，自動轉入離線規則生成:", e);
          const badge = document.getElementById('aiStatusBadge');
          if (badge) {
            badge.innerText = '⚪ 離線備用模式';
            badge.style.background = '#475569';
          }
        } finally {
          btn.innerHTML = originalBtnText;
          btn.disabled = false;
        }
      }

      // 離線本地規則生成回退
      if (raceKey === 'RANDOM') {
        let keys = Object.keys(RACES);
        raceKey = keys[Math.floor(Math.random()*keys.length)];
      }
      if (classKey === 'RANDOM') {
        let keys = Object.keys(CLASSES);
        classKey = keys[Math.floor(Math.random()*keys.length)];
      }
      if (bgKey === 'RANDOM') {
        let bgs = ["民間英雄 (Folk Hero)", "士兵 (Soldier)", "侍祭 (Acolyte)", "行會工匠 (Guild Artisan)", "貴族 (Noble)", "流浪兒 (Urchin)", "學者 (Sage)"];
        bgKey = bgs[Math.floor(Math.random()*bgs.length)];
      }
      if (!name) {
        let names = ["老丹恩", "達格瑪", "貝拉", "摩斯", "芬恩", "艾德加", "奧爾森", "莉莉安", "維克多", "賽蓮娜"];
        name = names[Math.floor(Math.random()*names.length)];
      }

      let lvParsed = parseLevel(document.getElementById('npcLevel').value);
      let level = lvParsed.level;
      let levelNote = lvParsed.note;
      let pb = Math.floor((level - 1) / 4) + 2;

      let storyText = document.getElementById('npcStory').value.trim();
      let traitVal = document.getElementById('npcTrait').value.trim();

      // 骰出 6 組點數
      let rolls = [];
      for (let i = 0; i < 6; i++) rolls.push(roll4d6dl1().total);
      rolls.sort((a,b) => b-a);

      let clsData = CLASSES[classKey] || CLASSES["戰士 (Fighter)"];
      let raceData = RACES[raceKey] || RACES["人類 (Human)"];

      let stats = {};
      clsData.primary.forEach((stat, idx) => {
        stats[stat] = { score: rolls[idx], mod: calcMod(rolls[idx]) };
      });

      // 武器與生活法器映射
      let combined = (storyText + " " + traitVal).toLowerCase();
      let weapon = { name: clsData.defaultWeapon, type: "標準軍用武器", damage: "正常", properties: "常規配置" };
      for (let w of THEMATIC_WEAPONS) {
        if (w.keywords.some(k => combined.includes(k))) {
          weapon = w;
          break;
        }
      }

      let focus = null;
      for (let f of THEMATIC_FOCUSES) {
        if (f.keywords.some(k => combined.includes(k))) {
          focus = f;
          break;
        }
      }

      // 特質
      let trait = null;
      if (traitVal && !["無", "沒有", "none", "nothing"].includes(traitVal.toLowerCase())) {
        if (traitVal.includes("火")) trait = { name: "炎脈共鳴", cat: "元素異能", desc: "受火焰傷害減半，攻擊自帶 1d4 火焰傷害。" };
        else if (traitVal.includes("霜") || traitVal.includes("冰")) trait = { name: "霜凍微光", cat: "元素異能", desc: "受寒冷傷害減半，受到暴擊時爆發冰霧使周遭敵人減速。" };
        else if (traitVal.includes("魂") || traitVal.includes("靈")) trait = { name: "靈視眼眸", cat: "超感官知", desc: "可看見 30 呎內靈體殘影，對幻術豁免優勢。" };
        else trait = { name: `${traitVal}之印`, cat: "自訂超常特質", desc: `在【${traitVal}】領域具備非凡天賦，檢定具優勢。` };
      }

      let hp = clsData.hpBase + (level - 1) * clsData.hpPer;

      currentNPCData = {
        name, raceKey, classKey, bgKey, level, levelNote, pb, hp, hd: `${level}${clsData.hd}`,
        rolls, stats, weapon, focus, trait, story: storyText, raceData, clsData
      };
      currentRawCardMarkdown = "";

      renderCard();
    }

    function renderCard() {

            <tr><td><strong>體魄 CON</strong></td><td class="stat-val">${d.stats.CON.score}</td><td class="stat-mod">${d.stats.CON.mod}</td><td>可自由選用：${d.raceData.bonus}</td></tr>
            <tr><td><strong>智力 INT</strong></td><td class="stat-val">${d.stats.INT.score}</td><td class="stat-mod">${d.stats.INT.mod}</td><td>可自由選用：${d.raceData.bonus}</td></tr>
            <tr><td><strong>感知 WIS</strong></td><td class="stat-val">${d.stats.WIS.score}</td><td class="stat-mod">${d.stats.WIS.mod}</td><td>可自由選用：${d.raceData.bonus}</td></tr>

        </table>

        <div class="section-h3">🎒 隨身裝備、武器與故事道具</div>

          <thead>
            <tr>
              <th>道具 / 武器名稱</th>
              <th>類型</th>
              <th>傷害骰 / 防護</th>

          </thead>
          <tbody>

              <td><strong>${d.weapon.name}</strong></td>
              <td>${d.weapon.type}</td>

              <td>${d.weapon.properties}</td>

            ${d.focus ? `
            <tr>
              <td><strong>${d.focus.name}</strong></td>

              <td>—</td>
              <td>${d.focus.desc}</td>
            </tr>
            ` : ''}

              <td><strong>防護衣物</strong></td>
              <td>護甲防禦</td>
              <td>${d.clsData.defaultArmor}</td>

        <div class="section-h3">⚔️ 職業與施法者特長 (Lv.${d.level})</div>

    function copyCardMarkdown() {
      if (currentRawCardMarkdown) {
        navigator.clipboard.writeText(currentRawCardMarkdown).then(() => {
          alert("✅ 直式角色卡 Markdown 全文已成功複製至剪貼簿！");
        });
        return;
      }
      if (!currentNPCData) return;
      let d = currentNPCData;
      let md = `# 📜 D&D 5E 劇情向 NPC 角色卡：${d.name}\n` +
               `> 等級：Lv.${d.level} | 熟練加值 (PB)：+${d.pb} | 生命值約：${d.hp} (${d.hd})\n\n` +
               `## 👤 基礎身分\n- 種族：${d.raceKey}\n- 職業：${d.classKey}\n- 背景：${d.bgKey}\n\n` +
               `## 🎲 靈活屬性建議 (4d6dl1 [${d.rolls.join(", ")}])\n` +
               `STR: ${d.stats.STR.score} (${d.stats.STR.mod}) | DEX: ${d.stats.DEX.score} (${d.stats.DEX.mod}) | CON: ${d.stats.CON.score} (${d.stats.CON.mod})\n` +
               `INT: ${d.stats.INT.score} (${d.stats.INT.mod}) | WIS: ${d.stats.WIS.score} (${d.stats.WIS.mod}) | CHA: ${d.stats.CHA.score} (${d.stats.CHA.mod})\n\n` +
               `## 🎒 隨身裝備與生活武器\n- 武器：${d.weapon.name} (${d.weapon.damage}) [${d.weapon.properties}]\n` +
               (d.focus ? `- 故事法器：${d.focus.name} [${d.focus.desc}]\n` : '') +
               `\n## 🎯 劇本線索\n${d.story || '掌握關鍵情資的樞紐角色'}`;

      navigator.clipboard.writeText(md).then(() => {
        alert("✅ 角色卡 Markdown 已成功複製至剪貼簿！");
      });
    }

    function exportJSON() {
      if (!currentNPCData) return;
      const jsonStr = JSON.stringify(currentNPCData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `NPC_${currentNPCData.name}_結構資料.json`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function exportCSV() {
      if (!currentNPCData) return;
      let d = currentNPCData;
      let rec = d.recommended_allocation || {};
      let rows = [
        ["欄位名稱", "數值內容"],
        ["角色姓名", d.name || ""],
        ["等級", `Lv.${d.level || 1}`],
        ["等級備註", d.level_note || d.levelNote || ""],
        ["預估挑戰等級CR", d.cr || "1/4"],
        ["陣營", d.alignment || ""],
        ["熟練加值", d.proficiency_bonus || `+${d.pb || 2}`],
        ["生命值_HP", `${d.hp || 10}`],
        ["種族", d.race || d.raceKey || ""],
        ["職業", d.class || d.class_name || d.classKey || ""],
        ["背景歷練", d.background || d.bgKey || ""],
        ["信仰神祇", d.deity || ""],
        ["4d6dl1原始點數池", d.raw_ability_rolls || (d.rolls ? d.rolls.join(", ") : "")],
        ["建議力量_STR", rec.STR ? `${rec.STR.recommended_base} (${rec.STR.base_mod_str})` : (d.stats ? `${d.stats.STR.score} (${d.stats.STR.mod})` : "")],
        ["建議敏捷_DEX", rec.DEX ? `${rec.DEX.recommended_base} (${rec.DEX.base_mod_str})` : (d.stats ? `${d.stats.DEX.score} (${d.stats.DEX.mod})` : "")],
        ["建議體魄_CON", rec.CON ? `${rec.CON.recommended_base} (${rec.CON.base_mod_str})` : (d.stats ? `${d.stats.CON.score} (${d.stats.CON.mod})` : "")],
        ["建議智力_INT", rec.INT ? `${rec.INT.recommended_base} (${rec.INT.base_mod_str})` : (d.stats ? `${d.stats.INT.score} (${d.stats.INT.mod})` : "")],
        ["建議感知_WIS", rec.WIS ? `${rec.WIS.recommended_base} (${rec.WIS.base_mod_str})` : (d.stats ? `${d.stats.WIS.score} (${d.stats.WIS.mod})` : "")],
        ["建議魅力_CHA", rec.CHA ? `${rec.CHA.recommended_base} (${rec.CHA.base_mod_str})` : (d.stats ? `${d.stats.CHA.score} (${d.stats.CHA.mod})` : "")],
        ["AI原創身世背景", d.ai_backstory || d.story || ""],
        ["AI言行舉止小動作", d.ai_personality_quirks || ""],
        ["DM跑團互動伏筆", d.ai_quest_hook || ""]
      ];

      let csvContent = "\uFEFF" + rows.map(e => e.map(x => `"${(x||'').toString().replace(/"/g, '""')}"`).join(",")).join("\n");
      let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      let url = URL.createObjectURL(blob);
      let a = document.createElement("a");
      a.href = url;
      a.download = `NPC_${d.name}_角色數據.csv`;
      a.click();
    }
