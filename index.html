<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D 5E 劇情導向非典型 NPC 智慧生成系統</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --gold: #f59e0b;
      --cyan: #38bdf8;
      --green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(129, 140, 248, 0.4);
      color: #818cf8;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--cyan);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      background: #080c14;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-btn:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .btn-generate:active {
      transform: translateY(0);
    }

    /* Output Card */
    .card-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-action {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: #334155;
      border-color: #475569;
    }

    .preview-card {
      background: #080c14;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      font-size: 14px;
      line-height: 1.7;
    }

    .preview-card h2 {
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 4px;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 8px;
    }

    .preview-card .meta-strip {
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .section-h3 {
      font-size: 16px;
      color: var(--cyan);
      margin: 18px 0 8px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    .stats-table, .equip-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }

    .stats-table th, .stats-table td,
    .equip-table th, .equip-table td {
      border: 1px solid #1e293b;
      padding: 8px 10px;
      text-align: left;
    }

    .stats-table th, .equip-table th {
      background: #0f172a;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #38bdf8;
    }

    .stat-mod {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--green);
    }

    .trait-alert {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--gold);
      padding: 10px 14px;
      border-radius: 4px;
      margin: 10px 0;
    }

    .hook-alert {
      background: rgba(99, 102, 241, 0.1);
      border-left: 4px solid var(--accent);
      padding: 10px 14px;
      border-radius: 4px;
      margin: 10px 0;
    }

    /* Print optimization */
    @media print {
      body { background: white; color: black; padding: 0; }
      .main-grid { display: block; }
      .panel:first-child, header, .card-actions { display: none; }
      #tokenUsageBar { display: none !important; }
      .panel { border: none; box-shadow: none; padding: 0; background: transparent; }
      .preview-card { border: 1px solid #ccc; background: white; color: black; }
      .preview-card h2 { color: black; border-color: black; }
      .section-h3 { color: black; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">D&D 5E 劇情向專用生成器 ｜ 雲端免裝部署版</div>
      <h1>D&D 5E 劇情導向非典型 NPC 智慧生成系統</h1>
      <p class="subtitle">告別死板冒險者模板 • 解耦生活外貌與戰鬥底層 • 生活道具自動映射武器法器</p>
      
      <!-- 線上部署版導覽列 -->
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap;">
        <a href="index.html" style="background: rgba(99, 102, 241, 0.25); border: 1px solid #818cf8; color: #c7d2fe; padding: 5px 14px; border-radius: 999px; text-decoration: none; font-size: 12.5px; font-weight: bold;">🎲 智慧生成器</a>
        <a href="DND_5E_NPC_Presentation_90S.html" target="_blank" style="background: rgba(30, 41, 59, 0.7); border: 1px solid #475569; color: #cbd5e1; padding: 5px 14px; border-radius: 999px; text-decoration: none; font-size: 12.5px;">🎬 90秒簡報 (線上看)</a>
        <a href="DND_5E_NPC_Project_Report.html" target="_blank" style="background: rgba(30, 41, 59, 0.7); border: 1px solid #475569; color: #cbd5e1; padding: 5px 14px; border-radius: 999px; text-decoration: none; font-size: 12.5px;">📑 期末專題報告 (線上看)</a>
        <a href="https://github.com/41154B003Sam/dnd-5e-npc-generator" target="_blank" style="background: rgba(30, 41, 59, 0.7); border: 1px solid #475569; color: #cbd5e1; padding: 5px 14px; border-radius: 999px; text-decoration: none; font-size: 12.5px;">📦 GitHub 倉儲</a>
      </div>
    </header>

    <div class="main-grid">
      <!-- 左側：輸入表單 -->
      <div class="panel">
        <div class="panel-title">⚙️ 角色靈感與條件設定</div>

        <div class="form-group">
          <label>快速填入經典範例：</label>
          <div class="quick-tags">
            <button class="tag-btn" onclick="applyPreset('farmer')">🌾 麥農草耙退隱戰士</button>
            <button class="tag-btn" onclick="applyPreset('wizard')">💨 抽煙斗的14環大魔導師</button>
            <button class="tag-btn" onclick="applyPreset('undertaker')">⛏️ 鐵鎬茶杯守墓人</button>
            <button class="tag-btn" onclick="applyPreset('chef')">🍖 剁骨刀火爆大廚</button>
          </div>
        </div>

        <div class="form-group">
          <label>角色姓名 (留空則隨機生成)：</label>
          <input type="text" id="npcName" placeholder="例如：老丹恩、摩斯、高登">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label>種族：</label>
            <select id="npcRace">
<option value="RANDOM">🎲 隨機決定</option>
              <option value="人類 (Human)">人類 (Human)</option>
              <option value="高等精靈 (High Elf)">高等精靈 (High Elf)</option>
              <option value="木精靈 (Wood Elf)">木精靈 (Wood Elf)</option>
              <option value="黑暗精靈 / 卓爾 (Drow)">黑暗精靈 / 卓爾 (Drow)</option>
              <option value="山地矮人 (Mountain Dwarf)">山地矮人 (Mountain Dwarf)</option>
              <option value="丘陵矮人 (Hill Dwarf)">丘陵矮人 (Hill Dwarf)</option>
              <option value="輕足半身人 (Lightfoot Halfling)">輕足半身人 (Lightfoot Halfling)</option>
              <option value="頑強半身人 (Stout Halfling)">頑強半身人 (Stout Halfling)</option>
              <option value="龍裔 (Dragonborn)">龍裔 (Dragonborn)</option>
              <option value="半獸人 (Half-Orc)">半獸人 (Half-Orc)</option>
              <option value="提夫林 (Tiefling)">提夫林 (Tiefling)</option>
              <option value="岩石侏儒 (Rock Gnome)">岩石侏儒 (Rock Gnome)</option>
              <option value="半精靈 (Half-Elf)">半精靈 (Half-Elf)</option>
            </select>
          </div>

          <div class="form-group">
            <label>職業 (Class)：</label>
            <select id="npcClass" onchange="updateSubclassOptions()">
<option value="RANDOM">🎲 隨機決定</option>
              <option value="戰士 (Fighter)">戰士 (Fighter)</option>
              <option value="法師 (Wizard)">法師 (Wizard)</option>
              <option value="遊盪者 (Rogue)">遊盪者 (Rogue)</option>
              <option value="牧師 (Cleric)">牧師 (Cleric)</option>
              <option value="野蠻人 (Barbarian)">野蠻人 (Barbarian)</option>
              <option value="聖騎士 (Paladin)">聖騎士 (Paladin)</option>
              <option value="德魯伊 (Druid)">德魯伊 (Druid)</option>
              <option value="吟遊詩人 (Bard)">吟遊詩人 (Bard)</option>
              <option value="武僧 (Monk)">武僧 (Monk)</option>
              <option value="遊俠 (Ranger)">遊俠 (Ranger)</option>
              <option value="術士 (Sorcerer)">術士 (Sorcerer)</option>
              <option value="契術師 (Warlock)">契術師 (Warlock)</option>
              <option value="奇械師 (Artificer)">奇械師 (Artificer)</option>
            </select>
          </div>

          <div class="form-group">
            <label>子職業 / 範型流派 (Subclass / Paradigm)：</label>
            <select id="npcSubclass">
              <option value="RANDOM">🎲 隨機決定範型 (Auto)</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label>背景歷練：</label>
            <select id="npcBackground">
<option value="RANDOM">🎲 隨機決定</option>
              <option value="侍僧 (Acolyte)">侍僧 (Acolyte)</option>
              <option value="派系特工 (Faction Agent)">派系特工 (Faction Agent)</option>
              <option value="公會工匠 (Guild Artisan)">公會工匠 (Guild Artisan)</option>
              <option value="變體公會工匠 (公會商人) (Guild Merchant)">變體公會工匠 (公會商人) (Guild Merchant)</option>
              <option value="氏族工匠 (Clan Crafter)">氏族工匠 (Clan Crafter)</option>
              <option value="朝臣 (Courtier)">朝臣 (Courtier)</option>
              <option value="化外之民 (Outlander)">化外之民 (Outlander)</option>
              <option value="烏斯伽部落成員 (Uthgardt Tribe Member)">烏斯伽部落成員 (Uthgardt Tribe Member)</option>
              <option value="士兵 (Soldier)">士兵 (Soldier)</option>
              <option value="教團騎士 (Knight of the Order)">教團騎士 (Knight of the Order)</option>
              <option value="傭兵老將 (Mercenary Veteran)">傭兵老將 (Mercenary Veteran)</option>
              <option value="城市守衛 (City Watch)">城市守衛 (City Watch)</option>
              <option value="變體城市守衛 (調查員) (Investigator)">變體城市守衛 (調查員) (Investigator)</option>
              <option value="流浪兒 / 孤兒 (Urchin)">流浪兒 / 孤兒 (Urchin)</option>
              <option value="學者 (Sage)">學者 (Sage)</option>
              <option value="平民英雄 (Folk Hero)">平民英雄 (Folk Hero)</option>
              <option value="繼承者 (Inheritor)">繼承者 (Inheritor)</option>
              <option value="水手 (Sailor)">水手 (Sailor)</option>
              <option value="變體水手 (海盜) (Pirate)">變體水手 (海盜) (Pirate)</option>
              <option value="隱士 (Hermit)">隱士 (Hermit)</option>
              <option value="藝人 (Entertainer)">藝人 (Entertainer)</option>
              <option value="變體藝人 (角鬥士) (Gladiator)">變體藝人 (角鬥士) (Gladiator)</option>
              <option value="失敗商人 (Failed Merchant)">失敗商人 (Failed Merchant)</option>
              <option value="賭徒 (Gambler)">賭徒 (Gambler)</option>
              <option value="原告 (Plaintiff)">原告 (Plaintiff)</option>
              <option value="競爭對手實習生 (Rival Intern)">競爭對手實習生 (Rival Intern)</option>
              <option value="修院學士 (Cloistered Scholar)">修院學士 (Cloistered Scholar)</option>
              <option value="城市賞金獵人 (Urban Bounty Hunter)">城市賞金獵人 (Urban Bounty Hunter)</option>
              <option value="罪犯 (Criminal)">罪犯 (Criminal)</option>
              <option value="變體罪犯 (間諜) (Spy)">變體罪犯 (間諜) (Spy)</option>
              <option value="詐欺師 (Charlatan)">詐欺師 (Charlatan)</option>
              <option value="貴族 (Noble)">貴族 (Noble)</option>
              <option value="變體貴族 (騎士) (Knight)">變體貴族 (騎士) (Knight)</option>
              <option value="深水城貴族 (Waterdhavian Noble)">深水城貴族 (Waterdhavian Noble)</option>
              <option value="遠行者 (Far Traveler)">遠行者 (Far Traveler)</option>
              <option value="噩夢纏身 (Haunted One)">噩夢纏身 (Haunted One)</option>
              <option value="阿沙里人 (Ashari)">阿沙里人 (Ashari)</option>
              <option value="魔法學院學者 (Lyceum Scholar)">魔法學院學者 (Lyceum Scholar)</option>
              <option value="扣環黨成員 (Clasp Member)">扣環黨成員 (Clasp Member)</option>
              <option value="重回正途的邪教徒 (Reformed Cultist)">重回正途的邪教徒 (Reformed Cultist)</option>
              <option value="一無所有者 (Deprived)">一無所有者 (Deprived)</option>
              <option value="俄佐立參議院官員 (Azorius Functionary)">俄佐立參議院官員 (Azorius Functionary)</option>
              <option value="波洛斯教團軍團兵 (Boros Legionnaire)">波洛斯教團軍團兵 (Boros Legionnaire)</option>
              <option value="析米克聯合科學家 (Simic Scientist)">析米克聯合科學家 (Simic Scientist)</option>
              <option value="歐佐夫辛迪加代表 (Orzhov Representative)">歐佐夫辛迪加代表 (Orzhov Representative)</option>
              <option value="伊捷聯盟工程師 (Izzet Engineer)">伊捷聯盟工程師 (Izzet Engineer)</option>
              <option value="拉鐸司宗派狂歡者 (Cult of Rakdos)">拉鐸司宗派狂歡者 (Cult of Rakdos)</option>
              <option value="古魯部族混亂者 (Gruul Anarch)">古魯部族混亂者 (Gruul Anarch)</option>
              <option value="瑟雷尼亞盟會新倡者 (Selesnya Initiate)">瑟雷尼亞盟會新倡者 (Selesnya Initiate)</option>
              <option value="葛加理群落特工 (Golgari Agent)">葛加理群落特工 (Golgari Agent)</option>
              <option value="底密爾會堂特工 (House Dimir)">底密爾會堂特工 (House Dimir)</option>
            </select>
          </div>

          <div class="form-group">
            <label>等級 / 關鍵字：</label>
            <input type="text" id="npcLevel" value="1" oninput="updateSubclassOptions()" placeholder="例如：1、14、大魔導師、老兵、封印">
          </div>
        </div>

        <div class="form-group">
          <label>獨特超常特質 (預設無，為常規凡人)：</label>
          <input type="text" id="npcTrait" placeholder="留空或輸入：無、火焰、霜凍、靈魂、自訂">
        </div>

        <div class="form-group">
          <label>劇情線索與非典型生活裝備補充：</label>
          <textarea id="npcStory" placeholder="輸入當前劇情或生活描述。例如：『表面是麥農，但真實身分是退隱禁衛長戰士，武器是一柄鋼齒長草耙』"></textarea>
        </div>

        <!-- 雙引擎設定：支援雲端線上部署 (GitHub Pages / Cloudflare Pages) 與本地離線免裝環境 -->
        <div class="form-group" style="background: rgba(15, 23, 42, 0.7); padding: 12px 14px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 12px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <label style="color: #38bdf8; font-weight: bold; margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px;">
              <span>🤖 雙引擎架構（雲端線上 0元版 / 本地）</span>
            </label>
            <span id="aiStatusBadge" style="font-size: 11px; background: #065f46; color: #a7f3d0; padding: 2px 8px; border-radius: 4px;">🟢 純本地離線規則引擎 (0元免費)</span>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
            <input type="checkbox" id="enableAiCheckbox" checked style="width: auto; margin: 0; cursor: pointer;">
            <label for="enableAiCheckbox" style="margin: 0; font-size: 12px; color: #cbd5e1; cursor: pointer;">啟用 Gemini AI 智慧敘事（若未提供金鑰，自動極速切換 5E 規則引擎）</label>
          </div>

          <!-- 可選金鑰設定區 (安全儲存於個人瀏覽器 localStorage，0 元免費使用) -->
          <div style="margin-top: 6px; font-size: 11.5px; color: #94a3b8;">
            <div style="display: flex; gap: 6px; align-items: center;">
              <input type="password" id="geminiApiKeyInput" placeholder="貼上自訂 Gemini API Key (可選，留空則以離線規則 0 秒極速開卡)" 
                     style="padding: 6px 10px; font-size: 11.5px; background: #0b0f19; border: 1px solid #475569; border-radius: 4px; color: #f8fafc; flex: 1;">
              <button type="button" onclick="saveApiKey()" style="padding: 6px 10px; background: #334155; color: #cbd5e1; border: 1px solid #475569; border-radius: 4px; cursor: pointer; font-size: 11px;">記住金鑰</button>

    // 4d6 drop lowest
    function roll4d6dl1() {
      let dice = [Math.floor(Math.random()*6)+1, Math.floor(Math.random()*6)+1, Math.floor(Math.random()*6)+1, Math.floor(Math.random()*6)+1];
      dice.sort((a,b) => b-a);
      return { total: dice[0]+dice[1]+dice[2], dice: dice, dropped: dice[3] };
    }

    function calcMod(score) {
      let mod = Math.floor((score - 10) / 2);
      return mod >= 0 ? `+${mod}` : `${mod}`;
    }

    
    function updateSubclassOptions() {
      const classSelect = document.getElementById('npcClass');
      const subclassSelect = document.getElementById('npcSubclass');
      const levelInput = document.getElementById('npcLevel');
      if (!classSelect || !subclassSelect) return;

      const classKey = classSelect.value;
      const levelVal = parseLevel(levelInput ? levelInput.value : '1').level;

      if (classKey === 'RANDOM' || !SUBCLASSES[classKey]) {
        subclassSelect.innerHTML = '<option value="RANDOM">🎲 隨機決定範型 (Auto)</option>';
        subclassSelect.disabled = false;
        subclassSelect.style.opacity = '1';
        return;
      }

      const subInfo = SUBCLASSES[classKey];
      const unlockLevel = subInfo.unlock_level;
      const cat = subInfo.category;

      if (levelVal < unlockLevel) {
        subclassSelect.innerHTML = `<option value="NONE">尚未解鎖${cat} (Lv.${unlockLevel} 解鎖)</option>`;
        subclassSelect.disabled = true;
        subclassSelect.style.opacity = '0.6';
      } else {
        subclassSelect.disabled = false;
        subclassSelect.style.opacity = '1';
        let optsHtml = '<option value="RANDOM">🎲 隨機決定範型 (Auto)</option>';
        subInfo.options.forEach(opt => {
          optsHtml += `<option value="${opt}">${opt}</option>`;
        });
        const currentVal = subclassSelect.value;
        subclassSelect.innerHTML = optsHtml;
        if (subInfo.options.includes(currentVal)) {
          subclassSelect.value = currentVal;
        }
      }
    }

    function parseLevel(input) {
      let text = (input || "").trim().toLowerCase();
      let lv = 1;
      let note = "";
      if (text.includes("大魔導師") || text.includes("大魔導") || text.includes("archmage")) {
        lv = 14; note = "大魔導師階級 (Lv.14)";
      } else if (text.includes("老兵") || text.includes("veteran")) {
        lv = 5; note = "精銳老兵 (Lv.5)";
      } else if (text.includes("學徒") || text.includes("apprentice")) {
        lv = 2; note = "見習學徒 (Lv.2)";
      } else {
        let match = text.match(/\d+/);
        if (match) lv = Math.min(20, Math.max(1, parseInt(match[0])));
      }
      if (text.includes("封印") || text.includes("詛咒") || text.includes("受限")) {
        note += " [⚠️ 部分法術環位已遭封印/限制]";
      }
      return { level: lv, note: note };
    }

    // XSS 資安防護：過濾並轉義所有使用者輸入字串，杜絕惡意代碼注入
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 瀏覽器直連 Gemini REST API (支援 GitHub Pages / Cloudflare Pages 靜態託管)
    async function callGeminiDirectlyFromBrowser(rawApiKey, payload) {
      const apiKey = String(rawApiKey || "").trim().replace(/^["']|["']$/g, "").trim();
      if (!apiKey) {
        throw new Error("API 金鑰為空，請輸入有效金鑰或留空使用離線規則");
      }

      // 支援 Google AI Studio 官方標準免費與付費模型，依相容性與速度由前至後依序嘗試：
      const modelsToTry = [
        "gemini-1.5-flash",
        "gemini-2.0-flash",
        "gemini-1.5-flash-8b",
        "gemini-1.5-pro"
      ];

      const prompt = `請為以下 D&D 5E NPC 進行深度的非典型、具備強烈反差與生活化氣息的角色創作：
- 角色姓名：${payload.name || '隨機決定'}
- 種族：${payload.race || '人類'}
- 職業：${payload.class_name || '戰士'}
- 範型流派：${payload.subclass_display || '自選合適範型'}
- 等級：Lv.${payload.level || 1} ${payload.level_note ? `(${payload.level_note})` : ''}
- 背景歷練：${payload.background || '平民英雄'}
- DM 提供的情境故事：${payload.story_context || '無特定情境，請根據種族職業自由發揮市井生活身分'}
- 非傳統特質/武器關鍵字：${payload.custom_trait || '無 (常規凡人，生活道具)'}

【設計規範】
1. 身分與戰力徹底解耦：生活化市井身分（如麥農、守墓人、廚師），但戰鬥底層是真實職業實力。
2. 範型流派深度融會：融入【${payload.subclass_display || '該職業'}】戰術、奧術或誓約風格。
3. 非典型裝備規格化：將日常道具（長草耙、修枝剪、鐵鎬、符文煙斗、茶杯）規格化為 5E 武器/法器傷害骰與特性。
4. 常規凡人原則：無神力不強加超常變異。
5. DM 跑團伏筆：給予 DM 直接可用的劇情引入線索。

請嚴格輸出符合以下結構的單一 JSON 物件（不要包含任何 markdown 標記外的贅字）：
{
  "name": "${payload.name || '角色姓名'}",
  "title": "角色稱號",
  "backstory": "200~300 字的生動故事身世...",
  "appearance_age": "外貌神態描述...",
  "personality_quirks": "2~3 項生活細節反差小動作與神態習慣...",
  "combat_philosophy": "戰鬥風格與範型哲學...",
  "quest_hook": "DM 跑團劇本線索伏筆...",
  "unorthodox_equipment": [
    {
      "name": "裝備名稱（如：鋼齒農用長草耙）",
      "type": "武器或法器類型",
      "damage": "傷害骰（如：1d8 (雙手 1d10) 穿刺）",
      "properties": "特性（如：多用、長柄）",
      "story_lore": "生活來歷背景"
    }
  ]
}`;

      let lastError = null;

      for (const model of modelsToTry) {
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: {
                temperature: 0.7
              }
            })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            const errMsg = errData.error?.message || `HTTP ${res.status}`;
            if (errMsg.includes("API key not valid") || errMsg.includes("API_KEY_INVALID") || errMsg.includes("Key not found")) {
              throw new Error("API 金鑰無效，請確認金鑰完整複製自 Google AI Studio (開頭應為 AIzaSy...)");
            }
            lastError = new Error(`模型 ${model} 回報: ${errMsg}`);
            continue;
          }

          const data = await res.json();
          if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
            throw new Error("Gemini 回傳內容格式不符");
          }

          const rawText = data.candidates[0].content.parts[0].text;
          let cleanJson = rawText.trim();
          
          if (cleanJson.startsWith("```")) {
            cleanJson = cleanJson.replace(/^```[a-zA-Z]*\n?/, "").replace(/\n?```$/, "").trim();
          }
          const sIdx = cleanJson.indexOf("{");
          const eIdx = cleanJson.lastIndexOf("}");
          if (sIdx !== -1 && eIdx !== -1) {
            cleanJson = cleanJson.substring(sIdx, eIdx + 1);
          }

          const parsed = JSON.parse(cleanJson);
          const usage = data.usageMetadata || {};
          return { parsed, usage, model };
        } catch (err) {
          lastError = err;
          if (err.message.includes("API 金鑰無效")) {
            throw err;
          }
        }
      }

      throw lastError || new Error("無法連線至 Gemini 模型，請檢查網路或金鑰狀態");
    }

               `- 信仰神祇：${d.deity || '萬物有靈'}\n` +

    function exportJSON() {

        ["建議感知_WIS", rec.WIS ? `${rec.WIS.recommended_base} (${rec.WIS.base_mod_str})` : (d.stats ? `${d.stats.WIS.score} (${d.stats.WIS.mod})` : "")],
